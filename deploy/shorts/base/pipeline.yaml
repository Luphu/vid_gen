# Daily pipeline run. One video at a time is enforced twice: concurrencyPolicy=Forbid and a DB lease.
# backoffLimit=0: the app persists stage progress; a failed pod is resumed by the next schedule or manually,
# never blindly retried by Kubernetes (which could repeat billable calls).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shorts-pipeline
  labels: { app.kubernetes.io/name: shorts, app.kubernetes.io/component: pipeline }
spec:
  schedule: "0 9,12,15,18,21 * * *"   # up to DAILY_VIDEO_LIMIT videos/day, one per run
  timeZone: Asia/Tbilisi
  suspend: true               # enable after `shorts doctor` passes (overlay patch)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels: { app.kubernetes.io/name: shorts, app.kubernetes.io/component: pipeline }
        spec:
          restartPolicy: Never
          imagePullSecrets: [{ name: ghcr-pull }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: shorts
              image: ghcr.io/luphu/nim/shorts
              args: [--json-logs, run]
              envFrom:
                - configMapRef: { name: shorts-config }
                - secretRef: { name: shorts-db }
                - secretRef: { name: shorts-app }
                - secretRef: { name: shorts-replicate, optional: true }
                - secretRef: { name: shorts-nvidia, optional: true }
                - secretRef: { name: shorts-youtube, optional: true }
                - secretRef: { name: shorts-s3, optional: true }
              resources:
                # ffmpeg (2 threads, 720x1280 x264) + base64 decode of one generated scene (<= 96 MiB).
                requests: { cpu: 500m, memory: 512Mi }
                limits:   { cpu: "2", memory: 1536Mi, ephemeral-storage: 5Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: artifacts, mountPath: /data }
          volumes:
            - name: work
              emptyDir: { sizeLimit: 4Gi }
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
            - name: artifacts
              persistentVolumeClaim: { claimName: shorts-artifacts }
---
# Retention: YouTube API data (<=25 days), artifacts (ARTIFACT_RETENTION_DAYS), stale work dirs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shorts-purge
  labels: { app.kubernetes.io/name: shorts, app.kubernetes.io/component: purge }
spec:
  schedule: "40 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/name: shorts, app.kubernetes.io/component: purge }
        spec:
          restartPolicy: Never
          imagePullSecrets: [{ name: ghcr-pull }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: shorts
              image: ghcr.io/luphu/nim/shorts
              args: [--json-logs, purge]
              envFrom:
                - configMapRef: { name: shorts-config }
                - secretRef: { name: shorts-db }
                - secretRef: { name: shorts-app }
                - secretRef: { name: shorts-s3, optional: true }
              resources:
                requests: { cpu: 20m, memory: 96Mi }
                limits:   { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: artifacts, mountPath: /data }
          volumes:
            - { name: work, emptyDir: { sizeLimit: 64Mi } }
            - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
            - name: artifacts
              persistentVolumeClaim: { claimName: shorts-artifacts }
---
# Nightly logical backup to a PVC on ANOTHER node (overlay pins it): a dead DB node does not take the
# backups with it. Keeps BACKUP_KEEP_DAYS days of pg_dump files.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shorts-db-backup
  labels: { app.kubernetes.io/name: shorts, app.kubernetes.io/component: backup }
spec:
  schedule: "10 3 * * *"
  timeZone: Asia/Tbilisi
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/name: shorts, app.kubernetes.io/component: backup }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: dump
              image: postgres:17.6-alpine
              command:
                - sh
                - -c
                - |
                  set -eu
                  f=/backup/shorts-$(date +%Y-%m-%d).dump
                  pg_dump --format=custom --no-owner --file="$f.part" "$DATABASE_URL"
                  pg_restore --list "$f.part" >/dev/null   # the archive must be readable
                  mv "$f.part" "$f"
                  find /backup -name 'shorts-*.dump' -mtime +"${BACKUP_KEEP_DAYS:-14}" -delete
                  ls -l /backup
              env:
                - { name: BACKUP_KEEP_DAYS, value: "14" }
              envFrom:
                - secretRef: { name: shorts-db }
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits:   { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: shorts-backups }
