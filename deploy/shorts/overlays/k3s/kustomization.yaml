apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Image pinned by digest. Updated by the "shorts" workflow through a pull request; Argo CD syncs after merge.
images:
  - name: ghcr.io/luphu/nim/shorts
    digest: sha256:5fb89252483b9255b79435b610ad776cd43c0181745563978267858bda7034a6
configMapGenerator:
  - name: shorts-config
    behavior: merge
    literals:
      - TREND_KEYWORDS=ai generated,ai video,sora,veo
      - TREND_REGION=US
      - TREND_LANGUAGE=en
      - TREND_WINDOW_HOURS=72
      - TREND_MAX_RESULTS=25
      - CONTENT_LANGUAGE=ru
      # Replicate models (commercial use per model page, checked 2026-10-11)
      - REPLICATE_TEXT_MODEL=qwen/qwen3-235b-a22b-instruct-2507
      - REPLICATE_VIDEO_MODEL=wan-video/wan-2.2-t2v-fast
      - REPLICATE_VIDEO_RESOLUTION=720p
      - REPLICATE_TTS_MODEL=minimax/speech-02-turbo
      - REPLICATE_TTS_VOICE=Russian_ReliableMan
      - TARGET_MIN_S=15
      - TARGET_MAX_S=30
      # Channel @whale_kiddo; content is general audience 13+, not made for kids (monetization)
      - YOUTUBE_CHANNEL_ID=UCGakgXaB9bPT374KLj1G0Xw
      - PUBLISH_CONSENT_CHANNEL_ID=UCGakgXaB9bPT374KLj1G0Xw
      - PUBLISH_MADE_FOR_KIDS=false
      - PUBLISH_PRIVACY=private
      # 5 videos/day: 5 scheduled runs, one video each; ~4 scenes/video + retries
      - DAILY_VIDEO_LIMIT=5
      - PUBLISH_DAILY_LIMIT=5
      - BUDGET_VIDEO_REQUESTS_PER_DAY=30
      - BUDGET_TEXT_REQUESTS_PER_DAY=60
      - BUDGET_TTS_REQUESTS_PER_DAY=40
      - BUDGET_YT_SEARCH_CALLS_PER_DAY=20
patches:
  # PostgreSQL and the artifacts PVC live on rpi-node-3 (most free RAM; no control plane, no Argo CD).
  - target: { kind: StatefulSet, name: shorts-postgres }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { kubernetes.io/hostname: rpi-node-3 }
  # Pipeline and purge mount the artifacts PVC -> must run where it is bound.
  - target: { kind: CronJob, name: "shorts-(pipeline|purge)" }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/nodeSelector
        value: { kubernetes.io/hostname: rpi-node-3 }
  # Backups go to a PVC on rpi2, i.e. off the DB node.
  - target: { kind: CronJob, name: shorts-db-backup }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/nodeSelector
        value: { kubernetes.io/hostname: rpi2 }
  # Enable the daily run only after `shorts doctor` reports no blockers:
  # - target: { kind: CronJob, name: shorts-pipeline }
  #   patch: |-
  #     - op: replace
  #       path: /spec/suspend
  #       value: false
