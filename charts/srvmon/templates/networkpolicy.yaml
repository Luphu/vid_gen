# Входящие соединения к подам srvmon — только изнутри namespace (туннель, vmalert, report).
# Исходящие не ограничены: туннелю нужен интернет, Alertmanager/report — api.telegram.org.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srvmon-ingress-same-namespace
  labels: {{- include "srvmon.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
