apiVersion: v1
kind: Service
metadata:
  name: srvmon-alertmanager
  labels: {{- include "srvmon.labels" . | nindent 4 }}
spec:
  selector: { app: srvmon-alertmanager }
  ports: [{ name: http, port: 9093 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srvmon-alertmanager
  labels: {{- include "srvmon.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 100Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srvmon-alertmanager
  labels: {{- include "srvmon.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO-том
  selector: { matchLabels: { app: srvmon-alertmanager } }
  template:
    metadata:
      labels: { app: srvmon-alertmanager }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      {{- include "srvmon.pin" . | nindent 6 }}
      securityContext: { fsGroup: 65534 }
      initContainers:
        # chat_id не хранится в Git: подставляем из Secret в шаблон конфига
        - name: render-config
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c"]
          args:
            - sed "s/__TG_CHAT_ID__/$(cat /secret/chat_id)/" /tpl/alertmanager.yml.in > /etc/alertmanager/alertmanager.yml
              && cp /tpl/telegram.tmpl /etc/alertmanager/
          volumeMounts:
            - { name: tpl, mountPath: /tpl }
            - { name: config, mountPath: /etc/alertmanager }
            - { name: telegram, mountPath: /secret, readOnly: true }
      containers:
        - name: alertmanager
          image: {{ .Values.images.alertmanager }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=
          ports: [{ name: http, containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /-/healthy, port: http }, periodSeconds: 30 }
          resources: {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: telegram, mountPath: /etc/alertmanager/secrets, readOnly: true }
            - { name: data, mountPath: /alertmanager }
            # шаблон сообщений использует .Local — нужен часовой пояс ноды
            - { name: localtime, mountPath: /etc/localtime, readOnly: true }
      volumes:
        - name: tpl
          configMap: { name: srvmon-alertmanager }
        - name: config
          emptyDir: {}
        - name: telegram
          secret:
            secretName: srvmon-telegram
            items:
              - { key: bot_token, path: tg_token }
              - { key: chat_id, path: chat_id }
        - name: data
          persistentVolumeClaim: { claimName: srvmon-alertmanager }
        - name: localtime
          hostPath: { path: /etc/localtime, type: File }
