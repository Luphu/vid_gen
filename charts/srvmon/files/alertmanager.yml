# Перенесено из Ansible-развёртывания srvmon (rpi1, docker compose).
global:
  resolve_timeout: 5m
templates:
  - /etc/alertmanager/*.tmpl
route:
  receiver: telegram
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 4h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: __TG_CHAT_ID__
        send_resolved: true
        parse_mode: HTML
        message: '{{ template "srvmon.tg" . }}'
inhibit_rules:
  # пока нет данных с сервера совсем — не спамить производными аномалиями
  - source_matchers: [alertname="ServerNoData"]
    target_matchers: [component="anomaly"]
