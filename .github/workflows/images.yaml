name: images
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # нативная arm64-сборка, без QEMU
    strategy:
      matrix:
        image: [srvmon-tunnel, srvmon-report]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: dir
        run: echo "path=images/${MATRIX_IMAGE#srvmon-}" >> "$GITHUB_OUTPUT"
        env: { MATRIX_IMAGE: "${{ matrix.image }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dir.outputs.path }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/luphu/nim/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/luphu/nim/${{ matrix.image }}:latest
