name: shorts
# Tests and lint on every change; on main: build the linux/arm64 image, push to GHCR and open a PR that
# pins the new digest in deploy/shorts/overlays/k3s. No kubeconfig here: Argo CD syncs merged Git state.
on:
  push:
    branches: [main]
    paths: ["shorts/**", "deploy/shorts/**", ".github/workflows/shorts.yaml"]
  pull_request:
    paths: ["shorts/**", "deploy/shorts/**", ".github/workflows/shorts.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm   # native arm64, same arch as the Raspberry Pi nodes
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: shorts }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: shorts }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q -rs
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/shorts

  manifests:
    runs-on: ubuntu-24.04-arm
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUSTOMIZE_VERSION: v5.7.1
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build
        run: |
          curl -fsSL -o /tmp/kz.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz"
          tar -xzf /tmp/kz.tgz -C /tmp kustomize
          /tmp/kustomize build deploy/shorts/overlays/k3s > /tmp/shorts.yaml
      - name: kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz"
          tar -xzf /tmp/kc.tgz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary /tmp/shorts.yaml
          /tmp/kubeconform -strict -summary -ignore-missing-schemas apps/shorts.yaml
      - name: policy checks
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import yaml, sys
          docs = [d for d in yaml.safe_load_all(open("/tmp/shorts.yaml")) if d]
          errors = []
          for d in docs:
              spec = d.get("spec", {})
              pod = (spec.get("jobTemplate", {}).get("spec", {}).get("template", {}).get("spec")
                     or spec.get("template", {}).get("spec"))
              if not pod:
                  continue
              for c in pod.get("containers", []) + pod.get("initContainers", []):
                  name = f"{d['kind']}/{d['metadata']['name']}/{c['name']}"
                  if "limits" not in c.get("resources", {}) or "memory" not in c["resources"]["limits"]:
                      errors.append(f"{name}: memory limit missing")
                  img = c["image"]
                  if img.startswith("ghcr.io/luphu/") and "@sha256:" not in img:
                      errors.append(f"{name}: own image must be pinned by digest: {img}")
                  if ":latest" in img:
                      errors.append(f"{name}: :latest tag")
          kinds = [d["kind"] for d in docs]
          if "Secret" in kinds:
              errors.append("Secret objects must not be committed")
          print("\n".join(errors) or "policy ok")
          sys.exit(1 if errors else 0)
          EOF

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, manifests]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: shorts
          target: runtime
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/luphu/nim/shorts:sha-${{ github.sha }}
      - name: smoke-run image
        run: |
          docker run --rm --platform linux/arm64 "ghcr.io/luphu/nim/shorts@${{ steps.build.outputs.digest }}" --help
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg \
            "ghcr.io/luphu/nim/shorts@${{ steps.build.outputs.digest }}" -hide_banner -encoders | grep -E ' (libx264|aac) '

  bump-digest:
    needs: image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: pin digest
        env: { DIGEST: "${{ needs.image.outputs.digest }}" }
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $DIGEST"; exit 1; }
          sed -i -E "s|^(\s*digest: )sha256:[0-9a-f]{64}|\1${DIGEST}|" deploy/shorts/overlays/k3s/kustomization.yaml
          git diff --stat
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/shorts-image-digest
          title: "shorts: pin image ${{ needs.image.outputs.digest }}"
          commit-message: "shorts: pin image digest ${{ needs.image.outputs.digest }}"
          body: |
            Built from ${{ github.sha }} (linux/arm64). Merging lets Argo CD roll the CronJobs to this digest.
          labels: deploy
