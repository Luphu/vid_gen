[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "Original YouTube Shorts from topic trends: discovery, analysis, NVIDIA NIM generation, FFmpeg render, YouTube upload"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
shorts = "shorts_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts_factory = ["prompts/*.md", "migrations/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg/ffprobe", "postgres: needs TEST_DATABASE_URL"]
